<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takamul Store</title>
</head>
<body>
    <h1>🛍️ Takamul Store</h1>

    <!-- حاوية تسجيل الدخول -->
    <div id="g_id_onload"
         data-client_id="358188138966-0fjp4adkc3t2ibj9iveka5kmf0a0h4v2.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="pill"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>

    <!-- حاوية عرض بيانات المستخدم (تظهر بعد تسجيل الدخول) -->
    <div id="userInfo" style="display:none; margin-top:20px;">
        <img id="userPicture" src="" width="50" height="50">
        <p id="userName"></p>
        <p id="userEmail"></p>
        <button onclick="logout()">تسجيل الخروج</button>
    </div>

    <script>
        // دالة معالجة نجاح تسجيل الدخول
        function handleCredentialResponse(response) {
            console.log("✅ تم تسجيل الدخول بنجاح!");
            console.log("🔑 الـ Token:", response.credential);
            
            try {
                // فك تشفير الـ Token لجلب بيانات المستخدم
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                console.log("👤 بيانات المستخدم:", payload);
                
                // عرض البيانات في الصفحة
                document.getElementById('userPicture').src = payload.picture;
                document.getElementById('userName').textContent = "👤 " + payload.name;
                document.getElementById('userEmail').textContent = "📧 " + payload.email;
                document.getElementById('userInfo').style.display = 'block';
                
                // إخفاء زر تسجيل الدخول
                document.querySelector('.g_id_signin').style.display = 'none';
                
                // تخزين البيانات (اختياري)
                localStorage.setItem('user', JSON.stringify(payload));
                
            } catch (e) {
                console.error("❌ خطأ في فك التشفير:", e);
            }
        }
        
        // دالة تسجيل الخروج
        function logout() {
            localStorage.removeItem('user');
            document.getElementById('userInfo').style.display = 'none';
            document.querySelector('.g_id_signin').style.display = 'block';
        }
        
        // التحقق من وجود جلسة سابقة
        window.onload = function() {
            const userData = localStorage.getItem('user');
            if (userData) {
                const payload = JSON.parse(userData);
                document.getElementById('userPicture').src = payload.picture;
                document.getElementById('userName').textContent = "👤 " + payload.name;
                document.getElementById('userEmail').textContent = "📧 " + payload.email;
                document.getElementById('userInfo').style.display = 'block';
                document.querySelector('.g_id_signin').style.display = 'none';
            }
        };
    </script>

    <!-- تحميل Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
