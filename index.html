<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takamul | متجر تكامل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Forminit SDK -->
    <script src="https://forminit.com/sdk/v1/forminit.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', "Segoe UI", Tahoma, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: #f0f2f5; color: #1a1a2e; }

        #loginScreen {
            position: fixed; inset: 0; background: rgba(26, 26, 46, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 99999; backdrop-filter: blur(12px);
            transition: opacity 0.6s ease;
        }
        #loginScreen.hidden { opacity: 0; pointer-events: none; }

        .login-box {
            background: #ffffff; padding: 50px 40px; border-radius: 30px;
            width: 100%; max-width: 480px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            text-align: center; animation: fadeInUp 0.6s ease;
            max-height: 90vh; overflow-y: auto;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-box .logo-img {
            width: 120px; height: 120px; object-fit: contain;
            margin-bottom: 20px; border-radius: 50%;
            background: #fff; padding: 15px;
            border: 3px solid #059669;
        }

        .login-box h2 { font-size: 36px; margin-bottom: 10px; color: #1a1a2e; font-weight: 800; }
        .login-box h2 span { color: #059669; }
        .login-box .subtitle { color: #64748b; margin-bottom: 30px; font-size: 16px; }
        .login-box .welcome-text { color: #1a1a2e; font-size: 18px; margin-bottom: 25px; line-height: 1.8; }
        .login-box .welcome-text span { color: #059669; font-weight: 700; }

        .login-error { color: #dc2626; font-size: 14px; margin-top: 12px; display: none; background: rgba(220, 38, 38, 0.1); padding: 10px; border-radius: 10px; border: 1px solid rgba(220, 38, 38, 0.2); }
        .login-error.show { display: block; }
        .login-success { color: #059669; font-size: 14px; margin-top: 12px; display: none; background: rgba(5, 150, 105, 0.1); padding: 10px; border-radius: 10px; border: 1px solid rgba(5, 150, 105, 0.2); }
        .login-success.show { display: block; }

        #g_id_signin { display: flex; justify-content: center; width: 100%; min-height: 50px; margin: 10px 0; }

        /* باقي الـ CSS كما هو... */
    </style>
</head>

<body>

    <!-- ===== شاشة تسجيل الدخول ===== -->
    <div id="loginScreen">
        <div class="login-box">
            <img src="https://g.top4top.io/p_3889jf2jz1.png" alt="Takamul Logo" class="logo-img">
            <h2><span>Takamul</span> Store</h2>
            <p class="subtitle">🔐 مرحباً بك في متجرنا</p>

            <div class="welcome-text">
                📱 <span>تسجيل الدخول</span> عبر حساب Google<br>
                للاستمتاع بتجربة تسوق مميزة
            </div>

            <!-- ===== Google Sign-In ===== -->
            <div id="g_id_onload"
                 data-client_id="825245484844-ucjdk7h2l9rer7uul5gfvi1u8iq47p6j.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>

            <div id="loginError" class="login-error"></div>
            <div id="loginSuccess" class="login-success"></div>

            <div style="margin-top: 25px; color: #94a3b8; font-size: 13px;">
                <a href="#" onclick="showPrivacyPolicy(event)" style="color: #059669; text-decoration: none;">سياسة الخصوصية</a>
                &nbsp;|&nbsp;
                <a href="#" onclick="showAboutModal(event)" style="color: #059669; text-decoration: none;">من نحن</a>
            </div>
        </div>
    </div>

    <!-- ===== المحتوى الرئيسي ===== -->
    <div id="mainContent" style="display: none;">
        <!-- المحتوى كما هو -->
    </div>

    <!-- ============================================================ -->
    <!-- كود الجافاسكريبت -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // 1. تهيئة Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCvB8r9dna0SCZXoNW4M0wacS50dNDWETQ",
            authDomain: "takamul-c419c.firebaseapp.com",
            projectId: "takamul-c419c",
            storageBucket: "takamul-c419c.firebasestorage.app",
            messagingSenderId: "169228140962",
            appId: "1:169228140962:web:1bceb52f2a36326111b2fb",
            measurementId: "G-M37JENVES1"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        console.log('✅ Firebase initialized!');

        // ============================================================
        // 2. Google Sign-In - معالجة الاستجابة
        // ============================================================
        function handleCredentialResponse(response) {
            console.log("✅ تم استلام رد من Google");

            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                console.log("👤 بيانات المستخدم:", payload);

                const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);

                auth.signInWithCredential(credential)
                    .then((result) => {
                        console.log('✅ تسجيل الدخول ناجح:', result.user);
                        document.getElementById('loginSuccess').textContent = '✅ مرحباً ' + (result.user.displayName || result.user.email) + '!';
                        document.getElementById('loginSuccess').classList.add('show');
                        document.getElementById('loginError').classList.remove('show');
                        showNotification('👋 مرحباً بك ' + (result.user.displayName || result.user.email));
                    })
                    .catch((error) => {
                        console.error('❌ خطأ Firebase:', error);
                        let errorMessage = '⚠️ فشل تسجيل الدخول عبر Google';
                        if (error.code === 'auth/account-exists-with-different-credential') {
                            errorMessage = '⚠️ هذا البريد الإلكتروني مسجل بطريقة أخرى.';
                        } else if (error.code === 'auth/popup-closed-by-user') {
                            errorMessage = '⚠️ تم إغلاق النافذة. حاول مرة أخرى.';
                        } else if (error.code === 'auth/unauthorized-domain') {
                            errorMessage = '⚠️ النطاق غير مصرح به. أضف النطاق في Firebase Console.';
                        }
                        document.getElementById('loginError').textContent = errorMessage;
                        document.getElementById('loginError').classList.add('show');
                    });

            } catch (e) {
                console.error("❌ خطأ:", e);
                document.getElementById('loginError').textContent = '⚠️ حدث خطأ غير متوقع';
                document.getElementById('loginError').classList.add('show');
            }
        }

        // ============================================================
        // 3. تسجيل الخروج
        // ============================================================
        function handleLogout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                auth.signOut()
                    .then(() => {
                        showNotification('👋 تم تسجيل الخروج');
                    })
                    .catch((error) => {
                        console.error('❌ Logout error:', error);
                    });
            }
        }

        // ============================================================
        // 4. مراقبة حالة المصادقة
        // ============================================================
        auth.onAuthStateChanged((user) => {
            const loginScreen = document.getElementById('loginScreen');
            const mainContent = document.getElementById('mainContent');
            const userEmailDisplay = document.getElementById('userEmailDisplay');

            if (user) {
                loginScreen.classList.add('hidden');
                mainContent.style.display = 'block';
                if (userEmailDisplay) userEmailDisplay.textContent = user.displayName || user.email || 'مستخدم';
                displayProducts(allProducts);
                updateCartIconCount();
                setTimeout(() => {
                    showNotification('👋 مرحباً بك في متجر Takamul');
                }, 500);
            } else {
                loginScreen.classList.remove('hidden');
                mainContent.style.display = 'none';
                document.getElementById('loginError').classList.remove('show');
                document.getElementById('loginSuccess').classList.remove('show');
                if (document.getElementById('cartSidebar')?.classList.contains('open')) toggleCart();
            }
        });

        // ============================================================
        // باقي الكود (المنتجات، السلة، الدفع، إلخ)
        // ============================================================
        // ... (أضف باقي الكود هنا)
    </script>
</body>
</html>
